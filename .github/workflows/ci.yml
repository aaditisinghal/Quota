name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep CI hermetic: no Elastic, Stripe or model calls. The live suites are opt-in via env vars.
  QUOTA_ELASTIC_OFF: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Test
        run: pytest -q

  ledger-integrity:
    # The guarantees the README claims, checked on every change: the hash chain and every
    # invariant hold, decisions replay from their recorded inputs, and the eval stays perfect.
    name: ledger integrity + eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Run the Acme demo into a ledger file
        run: python -m quota demo acme --db ci-ledger.db

      - name: Verify hash chain + all invariants
        run: python -m quota verify --db ci-ledger.db

      - name: Replay recorded decisions
        run: |
          for d in D-0001 D-0005 D-0007; do
            python -m quota replay "$d" --db ci-ledger.db | tail -1
          done

      - name: Eval (seed 7) and enforce the scorecard
        run: |
          python -m quota eval --seed 7 --out runs
          python - <<'EOF'
          import json, sys
          card = json.load(open("runs/seed-7/scorecard.json"))
          gates = {
              "recall == 100%": card["recall"] == 1,
              "false flags == 0": card["false_flags"] == 0,
              "wrong automatic payouts == 0": card["wrong_automatic_payouts"] == 0,
              "replay match == 100%": card["replay_match"] == 1,
          }
          for name, ok in gates.items():
              print(("PASS " if ok else "FAIL ") + name)
          sys.exit(0 if all(gates.values()) else 1)
          EOF

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-seed-7
          path: runs/seed-7/
          if-no-files-found: ignore

  docker:
    # Build the image, boot it, and wait for the ledger health endpoint to report every invariant OK.
    name: docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quota:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot and probe
        run: |
          docker run -d --name quota -p 8000:8000 quota:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ledger/health -o health.json; then break; fi
            sleep 2
          done
          test -s health.json || { echo "service never became healthy"; docker logs quota; exit 1; }
          python3 - <<'EOF'
          import json, sys
          health = json.load(open("health.json"))
          bad = [i["name"] for i in health["invariants"] if not i["ok"]]
          print("invariants:", ", ".join(i["name"] for i in health["invariants"]))
          sys.exit(f"failing invariants: {bad}" if bad else 0)
          EOF
          docker inspect --format '{{.State.Health.Status}}' quota || true

      - name: Container logs
        if: always()
        run: docker logs quota || true
