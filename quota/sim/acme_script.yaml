    {kind: dispute, deal_ref: acme, line_ref: null, field: booking_date, asserted_value: "2026-03-31",
     amount_cents: null, quote: "Acme closed Mar 31"}
  "Come on, everyone knows it closed in March.":
    {kind: dispute, deal_ref: null, line_ref: null, field: booking_date, asserted_value: "2026-03",
     amount_cents: null, quote: "everyone knows it closed in March"}
  "escalate":
